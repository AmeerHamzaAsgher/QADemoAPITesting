name: QA-Demo API Tests

# Runs the existing Newman/Postman API automation suite (Phases 3-6 of this
# project) automatically on every push and pull request. This workflow does
# not re-implement testing logic - it only invokes the same `npm test`
# command already used for local execution (see docs/NEWMAN_API_AUTOMATION.md).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    name: Run Newman API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # LTS release compatible with Newman 6.x (see package.json engines
          # and docs/GITHUB_ACTIONS_CICD.md for why this was chosen over the
          # newer Node version used on the local development machine).
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      # Executes the exact same command a developer runs locally:
      # npm test -> runs the main suite (folders 01-07) plus all 4 Phase 5
      # workflows via Newman, against the checked-in QA-Demo Environment
      # (no secrets required - see docs/GITHUB_ACTIONS_CICD.md, "Secrets").
      # Newman's non-zero exit code on any failed assertion is what causes
      # this step - and therefore the whole job - to fail; nothing here
      # suppresses or overrides that exit code.
      - name: Run API test suite (npm test / Newman)
        run: npm test

      # Uploads whatever HTML reports were generated, even if a prior stage
      # of npm test failed partway through (always() ensures this step still
      # runs so failure reports are never lost). Reports are never committed
      # to the repository - only published as a downloadable CI artifact.
      - name: Upload Newman HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
